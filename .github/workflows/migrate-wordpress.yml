name: Migrate WordPress to Markdown

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run WordPress migration
        shell: bash
        run: |
          set -euo pipefail

          test -s migration/wordpress-export.xml
          pnpm migrate:wordpress

          POST_COUNT=$(find source/_posts -type f -name '*.md' | wc -l)
          DRAFT_COUNT=$(find source/_drafts -type f -name '*.md' 2>/dev/null | wc -l)

          test "$POST_COUNT" -gt 0
          echo "Published posts: $POST_COUNT"
          echo "Draft posts: $DRAFT_COUNT"

      - name: Package migrated content
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p /tmp/migrated-content/posts /tmp/migrated-content/drafts
          cp -r source/_posts/. /tmp/migrated-content/posts/
          if [ -d source/_drafts ]; then
            cp -r source/_drafts/. /tmp/migrated-content/drafts/
          fi

          cd /tmp
          zip -r wordpress-markdown.zip migrated-content

      - name: Upload Markdown artifact
        uses: actions/upload-artifact@v4
        with:
          name: wordpress-markdown
          path: /tmp/wordpress-markdown.zip
          if-no-files-found: error
          retention-days: 7
