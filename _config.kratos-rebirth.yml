################## 系统配置 ##################

search:
  includes:
    - post
    - page

check_update: false

################## 样式配置 ##################

# 图片配置
image:
  favicon: "/images/favicon-avatar.ico" # 站点图标
  avatar: "/images/avatar.jpg"
  banner:
    light: "/images/banner.webp"
    dark: "/images/banner_dark.webp"
  background:
    light: "https://dev.krt.moe/demo-assets/bg.webp"
    dark: "https://dev.krt.moe/demo-assets/bg.webp"

# 文章特色图配置
posts:
  default_cover: "https://api.yppp.net/pc" # 修改为你要使用的图片地址

# 顶部导航栏配置
nav:
  items:
    - label: 首页
      icon: home
      url: /
    - label: 档案馆
      icon: file
      url: /archives/
    - label: 链接
      icon: link
      submenu:
        - label: 代码仓库
          icon: code
          url: https://github.com/Candinya/Kratos-Rebirth
        - label: 项目文档
          icon: book
          url: https://wiki.krt.moe
    - label: 个人主页
      icon: link
      url: https://yuixd.top
     
# Footer 页脚配置
footer:
  links:
    - icon: github
      link: https://github.com/kratos-rebirth
    - icon: rss
      link: /atom.xml
  components:
    uptime:
      since: "2025/11/18 17:03:12"
      text: "本站已在风雨中飘摇"
    author:
      homepage: "https://github.com/Candinya/Kratos-Rebirth/graphs/contributors"
    additional: # 托管信息等
      - - 由 <a href="https://hexo.io" target="_blank" rel="nofollow">Hexo</a> 强力驱动
        - 在 <a href="https://github.io" target="_blank">Github Pages</a> 暖心托管

# 代码高亮
# syntax_highlighter:
#   theme: atom-dark # 代码高亮主题（请参照具体的高亮插件对应的主题样式）

# Widgets 侧边栏小挂件
sidebar:
  widgets:
    - about
    - splitter
    - toc
    - category
    - tagcloud
    - posts

# 分享组件设置
share:
  enable: true
  title: "分享这一刻"
  message: "让朋友们也来瞅瞅！"
  platforms:
    - name: "喵窝"
      icon: <svg fill="currentColor" width="18" height="18" viewBox="0 0 329 388"><path d="M0,36.226c0,-19.993 16.233,-36.226 36.226,-36.226c13.788,0 25.787,7.719 31.908,19.068l188.366,229.845l0,-111.259c-6.356,5.508 -14.645,8.843 -23.707,8.843c-19.994,0 -36.226,-16.232 -36.226,-36.226c-0,-8.551 2.968,-16.413 7.93,-22.613l-0.015,-0.013l56.614,-69.08c6.2,-11.073 18.047,-18.565 31.63,-18.565c19.994,0 36.227,16.233 36.227,36.226l-0,314.644c-0,19.994 -16.233,36.226 -36.227,36.226c-13.166,0 -24.701,-7.039 -31.044,-17.555l-189.229,-230.899l-0,212.228c-0,19.994 -16.233,36.226 -36.227,36.226c-19.993,0 -36.226,-16.232 -36.226,-36.226l0,-314.644Z" /></svg>
      color: "#62b6e7"
      link: "https://nya.one/share?text=%3E%20$TITLE%0A%3E%0A%3E%20$SUMMARY%0A----%20$SITE%0A%0A$URL"

# 打赏组件设置
donate:
  enable: true
  title: "赞助喵"
  message: 非常感谢您的喜欢！ <i class="fa fa-heart" style="color:#d43f57"></i>
  qrcode_placeholder: "https://dev.krt.moe/demo-assets/donate.webp"
  platforms:
    - name: "模拟支付"
      icon: "credit-card"
      color: "skyblue"
      qrcode: "example_payment"

# 版权说明
copyright_notice:
  in_page:
    enable_at:
      - post
      - page

# 评论系统
comments:
  core:
    enable_at:
    # - index
      - post
      - page
    template:
      _shared: ""
      index: ""
      post: ""
      page: ""
  count:
    enable_at: []
    # - index
    # - post
    template:
      _shared: ""
      index: ""
      post: ""

# 访问数量统计
visit_count:
  enable_at: []
  template:
    _shared: ""
    index: ""
    post: ""

################## 额外的注入代码 ##################
additional_injections:
  head: |
    <link rel="stylesheet" href="/css/site-custom.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aplayer@1.10.1/dist/APlayer.min.css">
    <style>
      .aplayer.aplayer-fixed { z-index: 1000; }
      /* 手机窄屏且为触摸设备；桌面、平板保持原歌词布局。 */
      .phone-lyrics { display: none; }
      @media (max-width: 480px) and (hover: none) and (pointer: coarse) {
        .aplayer.aplayer-fixed .aplayer-body { max-width: calc(100vw - 18px); }
        .aplayer.aplayer-fixed .aplayer-lrc { visibility: hidden; }
        .phone-lyrics {
          display: block;
          position: fixed;
          inset: 0;
          pointer-events: none;
          z-index: 1001;
        }
        .phone-lyrics::before, .phone-lyrics::after {
          position: absolute;
          top: 50%;
          transform: translateY(-50%);
          writing-mode: vertical-rl;
          text-orientation: upright;
          max-height: calc(100dvh - 180px);
          overflow: hidden;
          font-size: 13px;
          line-height: 22px;
          letter-spacing: 2px;
          color: #fff;
          text-shadow: 0 1px 3px #000, 0 0 4px #000;
        }
        .phone-lyrics::before { content: attr(data-left); left: max(4px, env(safe-area-inset-left)); }
        .phone-lyrics::after { content: attr(data-right); right: max(4px, env(safe-area-inset-right)); }
      }
    </style>
  footer: |
    <!-- 网易云歌单：替换 id 即可更换歌单 -->
    <!-- 想来看我的网易云主页吗，欢迎来https://music.163.com/#/user/home?id=13115793587 -->
    <meting-js
      api="https://blog.yuixd.top/music-api/api?server=:server&amp;type=:type&amp;id=:id"
      server="netease"
      type="playlist"
      id="18563412205"
      fixed="true"
      mini="true"
      autoplay="true"
      list-folded="true"
      order="random"
      loop="all"
      theme="#e57393"
      preload="none"
      volume="0.5"
    ></meting-js>
  after_footer: |
    <script defer src="https://cdn.jsdelivr.net/npm/aplayer@1.10.1/dist/APlayer.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/meting@2.0.1/dist/Meting.min.js"></script>
    <script>
      (() => {
        const phone = matchMedia('(max-width: 480px) and (hover: none) and (pointer: coarse)');
        const sides = document.createElement('div');
        sides.className = 'phone-lyrics';
        sides.setAttribute('aria-hidden', 'true');
        document.body.appendChild(sides);
        let previous = null;
        function splitLyrics(text) {
          const chars = typeof Intl.Segmenter === 'function'
            ? Array.from(new Intl.Segmenter(undefined, { granularity: 'grapheme' }).segment(text), part => part.segment)
            : Array.from(text);
          const pairs = { '(': ')', '（': '）', '[': ']', '【': '】', '「': '」', '『': '』' };
          const closers = new Set(Object.values(pairs));
          const stack = [];
          const boundaries = [];
          let groupStart = -1;
          let translationStart = -1;
          for (let i = 0; i < chars.length; i++) {
            const ch = chars[i];
            if (pairs[ch]) {
              if (!stack.length) groupStart = i;
              stack.push(pairs[ch]);
            } else if (closers.has(ch)) {
              if (stack[stack.length - 1] === ch) {
                stack.pop();
                if (!stack.length && i === chars.length - 1 &&
                    (chars[groupStart] === '(' || chars[groupStart] === '（')) {
                  translationStart = groupStart;
                }
              }
            }
            if (!stack.length && i < chars.length - 1) boundaries.push(i + 1);
          }
          const at = index => [
            chars.slice(0, index).join('').trim(),
            chars.slice(index).join('').trim()
          ];
          if (translationStart > 0) return at(translationStart);
          const middle = chars.length / 2;
          const preferred = boundaries.filter(index =>
            /[\s,，。.!！?？;；:：、]/u.test(chars[index - 1]) || /^\s$/u.test(chars[index])
          );
          const nearby = preferred.filter(index => Math.abs(index - middle) <= chars.length / 4);
          const candidates = nearby.length ? nearby : boundaries;
          if (!candidates.length) return [text, ''];
          candidates.sort((a, b) => Math.abs(a - middle) - Math.abs(b - middle) || a - b);
          return at(candidates[0]);
        }
        function sync() {
          const player = document.querySelector('.aplayer.aplayer-fixed');
          const line = player && player.querySelector('.aplayer-lrc-current');
          const hidden = player && player.querySelector('.aplayer-lrc-hide');
          const text = phone.matches && !hidden && line ? line.textContent.trim() : '';
          if (text === previous) return;
          previous = text;
          const [left, right] = splitLyrics(text);
          sides.dataset.left = left;
          sides.dataset.right = right;
        }
        new MutationObserver(sync).observe(document.body, {
          subtree: true, childList: true, characterData: true,
          attributes: true, attributeFilter: ['class']
        });
        phone.addEventListener('change', sync);
        sync();
      })();
    </script>
  tools: "" # 注入到页面右下角浮动工具栏里的功能按钮
