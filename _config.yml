
# Site
title: 我的 Hexo 博客
subtitle: ''
description: 记录学习、兴趣与日常折腾
keywords:
  - Hexo
  - Blog
author: 唯
language: zh-CN
timezone: Asia/Shanghai

# URL
url: https://hexo.yuixd.top
root: /
permalink: :year/:month/:day/:title/

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories

# Writing
new_post_name: :title.md
default_layout: post
post_asset_folder: false

# Theme
theme: landscape

# Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm:ss

# Extensions
index_generator:
  path: ''
  per_page: 10
  order_by: -date

archive_generator:
  per_page: 20
  yearly: true
  monthly: true

category_generator:
  per_page: 10
  order_by: -date

tag_generator:
  per_page: 10
  order_by: -date

# Deployment
deploy:
  type: ''
